name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Deep Code Review
    runs-on: ubuntu-latest
    # Skip Dependabot PRs — they are auto-generated dependency updates, not human code
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather PR context
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          git diff origin/${{ github.base_ref }}...HEAD --name-only > changed_files.txt

      - name: Review with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/review.py

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "$(cat review.txt)"
