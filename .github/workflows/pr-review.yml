name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Deep Code Review with Claude
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather PR context
        run: |
          # Code diff
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

          # Changed file list
          git diff origin/${{ github.base_ref }}...HEAD --name-only > changed_files.txt

          # CONTRIBUTING.md for guideline checking
          cat CONTRIBUTING.md > contributing.txt

          # LICENSE for license checking
          cat LICENSE > license.txt

          echo "Changed files:"
          cat changed_files.txt

      - name: Deep Review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import os

          with open("pr_diff.txt", "r") as f:
              diff = f.read()

          with open("changed_files.txt", "r") as f:
              changed_files = f.read()

          with open("contributing.txt", "r") as f:
              contributing = f.read()

          with open("license.txt", "r") as f:
              license_text = f.read()

          if not diff.strip():
              with open("review.txt", "w") as f:
                  f.write("No code changes detected in this PR.")
              exit(0)

          if len(diff) > 15000:
              diff = diff[:15000] + "\n\n[diff truncated — showing first 15000 chars]"

          prompt = f"""You are a strict but fair OSS maintainer reviewing a pull request for **flowmcp** — a simple RAG + MCP + LLM pipeline framework (Python + Java).

This is an open source project. Your job is to thoroughly review this PR and give the maintainer a clear, detailed report so they can decide whether to merge or request changes. **You do not merge — the maintainer always merges manually.**

---

## Changed files
{changed_files}

## Code Diff
```
{diff}
```

## CONTRIBUTING.md (project guidelines)
{contributing}

## LICENSE (MIT)
{license_text}

---

Review this PR across ALL of the following dimensions. Be specific — reference file names and line numbers where possible.

### 1. CORRECTNESS
- Does the code do what the issue/PR claims?
- Are there any bugs, logic errors, or off-by-one errors?
- What happens with empty inputs, None values, large inputs, special characters?
- Are error cases handled properly?

### 2. EDGE CASES
- List specific edge cases that are NOT covered
- Will this break for any realistic input?

### 3. TESTS
- Are tests included for the new code?
- Do the tests actually cover the important cases or just the happy path?
- Could these tests pass even if the implementation is wrong?

### 4. CONTRIBUTING.md COMPLIANCE
- Does the PR follow the project's contribution guidelines?
- Correct branch naming, commit message style, setup instructions followed?

### 5. LICENSE COMPLIANCE
- Does any new file have the correct license header if required?
- Does the code introduce any dependency with an incompatible license?

### 6. SECURITY
- Any hardcoded secrets, API keys, or credentials?
- Any input that goes directly to a shell command, file path, or eval?
- Any dependency added — is it trustworthy and well-maintained?

### 7. CODE QUALITY
- Is the code consistent with the existing codebase style?
- Is it simple and readable or unnecessarily complex?
- Any dead code, unused imports, or leftover debug statements?

### 8. BREAKING CHANGES
- Does this change any existing public API or behavior?
- Will existing users' code break after this merge?

---

Respond in exactly this format:

## flowmcp PR Review 🔍

**Verdict:** ✅ SAFE TO MERGE / ⚠️ NEEDS CHANGES / ❌ DO NOT MERGE

**What this PR does:**
(one clear sentence)

---

### Correctness
(findings or "✅ No issues found")

### Edge Cases
(findings or "✅ All major edge cases handled")

### Tests
(findings or "✅ Tests are adequate")

### Contributing Guidelines
(findings or "✅ Follows guidelines")

### License
(findings or "✅ No license issues")

### Security
(findings or "✅ No security concerns")

### Code Quality
(findings or "✅ Clean and consistent")

### Breaking Changes
(findings or "✅ No breaking changes")

---

### Action required
(If NEEDS CHANGES: bullet list of exact things the contributor must fix before merge.
If SAFE TO MERGE: "No action needed — maintainer can merge when ready.")

---
*This review was generated automatically. Final merge decision is always made by the maintainer.*"""

          payload = json.dumps({
              "model": "claude-sonnet-4-5",
              "max_tokens": 2048,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read())
              review = result["content"][0]["text"]

          with open("review.txt", "w") as f:
              f.write(review)

          print(review)
          EOF

      - name: Post review comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW=$(cat review.txt)
          gh pr comment ${{ github.event.pull_request.number }} --body "$REVIEW"
