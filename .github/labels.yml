# GitHub Labels Configuration
# Synced automatically via .github/workflows/labels.yml

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

- name: "java"
  color: "b07219"
  description: "Related to the Java SDK"

- name: "python"
  color: "3572a5"
  description: "Related to the Python SDK"

- name: "rag"
  color: "e4b429"
  description: "Related to the RAG module"

- name: "llm"
  color: "6f42c1"
  description: "Related to LLM providers"

- name: "mcp"
  color: "28a745"
  description: "Related to the MCP module"

- name: "breaking change"
  color: "e11d48"
  description: "Introduces a breaking API change"

- name: "needs review"
  color: "fbca04"
  description: "Waiting for review"

- name: "ready to merge"
  color: "0e8a16"
  description: "Approved and ready to merge"

- name: "WIP"
  color: "ededed"
  description: "Work in progress — not ready for review"
